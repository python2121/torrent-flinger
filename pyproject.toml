[project]
name = "torrent-flinger"
version = "0.1.0"
description = "System-tray remote for a Transmission server: fling magnet/.torrent links from any browser, no extension required"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.scripts]
torrent-flinger = "flinger.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flinger", "flinger.core", "flinger.ui"]

[tool.setuptools.package-data]
flinger = ["assets/*.png"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ006: local-time display is intended; RUF012: Qt idioms use class-level lists
ignore = ["DTZ006", "RUF012"]

